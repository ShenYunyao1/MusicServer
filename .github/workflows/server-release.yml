name: Pikmelo Server Docker tests and release

on:
  push:
    branches: [main, 'codex/docker-compose']
    tags: ['v*']
    paths: ['server/**', 'contracts/**', 'Docs/服务器/协议/**', '.github/workflows/server-release.yml']
  pull_request:
    paths: ['server/**', 'contracts/**', 'Docs/服务器/协议/**', '.github/workflows/server-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable schema-8 baseline for installation acceptance
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          ref: dfca68d017c4f226f6ef76985f8b76ec5a1d5e3b # v0.21.12, schema 8
          path: schema8-baseline
          persist-credentials: false
          sparse-checkout: server
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - name: Install ffprobe (Ubuntu)
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffprobe; then
            # Hosted Azure mirrors have intermittently stalled during release builds.
            for source_path in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors*.txt; do
              if [ -f "$source_path" ]; then
                sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source_path"
              fi
            done
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
      - name: Install ffprobe (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        run: if (!(Get-Command ffprobe -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: Tests and vet
        run: |
          go test ./... -count=1 -timeout "$GO_TEST_TIMEOUT"
          if [ "$?" -ne 0 ]; then exit 1; fi
          go vet ./...
        shell: bash
        env:
          CGO_ENABLED: '0'
          # Full account/tag coverage performs real Argon2 work. Hosted Windows
          # runners exceed five minutes while individual cases still progress.
          GO_TEST_TIMEOUT: ${{ runner.os == 'Windows' && '600s' || '180s' }}
      - name: Linux race tests
        if: runner.os == 'Linux'
        run: |
          go test -race ./internal/update -count=1 -timeout 120s
          go test -race ./internal/music -run '^TestListening|^TestTemporaryUpload' -count=1 -timeout 90s
          go test -race ./internal/music -run '^TestRound[234]' -count=1 -timeout 180s
          go test -race ./internal/music -run '^TestScan|^TestAssetDirectory|^TestExactArtwork|^TestDirectoryBytes|^TestRestore|^TestLegacySQLite|^TestPermanent' -count=1 -timeout 90s
          go test -race ./internal/music -run '^TestAudit(KnownEndpointMethods|JSONPlaylistConflicts|RevokedSessionCannot|BackupCancellation|AdminPlayback|RevokedDuringMultipart|MultipartBodyLimit)|^TestSystemLogs' -count=1 -timeout 90s
          go test -race ./internal/music -run '^TestPlayback|^TestRealtime|^TestAccountDeletion|^TestKeyDeletion|^TestStorage|^TestManagedBackup|^TestBackup|^TestResumable|^TestBrowse|^TestObjectSync|^TestMail|^TestEmail|^TestRegistration|^TestAccountStorage|^TestUploadEmailPolicy|^TestSchemaMigration|^TestTag|^TestTrackTag|^TestTrackFilter|^TestSavedTrackFilter' -count=1 -timeout 240s
      - name: Linux installation integration
        if: runner.os == 'Linux'
        run: |
          (cd "$GITHUB_WORKSPACE/schema8-baseline/server" && CGO_ENABLED=0 go build -trimpath -buildvcs=true -o "$GITHUB_WORKSPACE/server/build/schema-current/baseline/musicserver" ./cmd/musicserver)
          CGO_ENABLED=0 go build -trimpath -buildvcs=true -o build/schema-current/musicserver ./cmd/pikmelo-server
          export MUSIC_SERVER_BASELINE_BINARY="$PWD/build/schema-current/baseline/musicserver"
          export MUSIC_SERVER_CANDIDATE_BINARY="$PWD/build/schema-current/musicserver"
          export MUSIC_SERVER_BASELINE_VERSION=0.21.12
          export MUSIC_SERVER_CANDIDATE_VERSION="$(go run ./cmd/release -version)"
          sudo -E env PATH="$PATH" bash tests/update-systemd.sh

      - name: Released schema-8 application rejects unsupported schema-9 metadata
        if: runner.os == 'Linux'
        run: |
          cp tests/fixtures/schema8-update-gate_test.go.txt "$GITHUB_WORKSPACE/schema8-baseline/server/internal/update/schema9_rejection_test.go"
          (cd "$GITHUB_WORKSPACE/schema8-baseline/server" && go test ./internal/update -run '^TestReleasedSchemaEightRejectsSchemaNine$' -count=1)

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [management, personal-center, realtime, browse, email, tags]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Checkout released schema-8 baseline for upgrade acceptance
        if: matrix.suite == 'tags'
        uses: actions/checkout@v4
        with:
          ref: dfca68d017c4f226f6ef76985f8b76ec5a1d5e3b # v0.21.12, schema 8
          path: schema8-baseline
          persist-credentials: false
          sparse-checkout: server
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/tests/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Ubuntu mirrors before browser dependencies
        run: |
          for source_path in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source_path" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source_path"
            fi
          done
          sudo tee /etc/apt/apt.conf.d/99-musicserver-ci >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
      - name: Install isolated browser dependencies
        run: |
          python -m pip install pexpect==4.9.0
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          cd tests
          npx playwright install --with-deps chromium
          if [ '${{ matrix.suite }}' = management ]; then npx playwright install --with-deps firefox; fi
      - name: Install ffprobe
        timeout-minutes: 8
        run: |
          if ! command -v ffprobe; then
            for source_path in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors*.txt; do
              if [ -f "$source_path" ]; then sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source_path"; fi
            done
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
      - name: Build isolated server
        # A real output sink is required by Firefox MediaElementSource/WebAudio.
        # Without one the runner reports OnMediaSinkAudioError and resume stalls.
        # The null sink consumes real decoded audio; playback assertions stay intact.
        run: go build -trimpath -buildvcs=true -o build/musicserver ./cmd/pikmelo-server
        env:
          CGO_ENABLED: '0'
      - name: Start isolated browser audio output
        if: matrix.suite == 'management'
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=musicserver_test rate=48000
          pactl set-default-sink musicserver_test
          pactl info
          pactl list short sinks
      - name: Build the released schema-8 baseline
        if: matrix.suite == 'tags'
        working-directory: schema8-baseline/server
        run: go build -trimpath -buildvcs=true -o "$GITHUB_WORKSPACE/server/build/schema-preview/released/musicserver" ./cmd/musicserver
        env:
          CGO_ENABLED: '0'
      - name: Real browser acceptance
        run: |
          node --test tests/browser-wait-test.cjs tests/resumable-ui.cjs tests/browse-state-test.cjs
          mkdir -p build/browser-diagnostics
          export TMPDIR="$PWD/build/browser-diagnostics"
          export MUSIC_SERVER_TEST_BINARY="$PWD/build/musicserver"
          if [ "$SUITE" = personal-center ]; then
            node tests/personal-dialogs-ui.cjs
            node tests/avatar-ui.cjs
            node tests/personal-center-ui.cjs
            MUSIC_SERVER_AVATAR_UI=1 go test ./internal/music -run '^TestAvatarLiveBrowser$' -count=1 -timeout 120s
          elif [ "$SUITE" = realtime ]; then
            MUSIC_SERVER_TEST_REALTIME_ONLY=1 node tests/management-ui.cjs
            MUSIC_SERVER_PUBLIC_DETAIL_UI=1 go test ./internal/music -run '^TestPublicDetailLiveBrowser$' -count=1 -timeout 90s -v
          elif [ "$SUITE" = browse ]; then
            node tests/library-pagination-contract.cjs
            node tests/browse-ui.cjs
          elif [ "$SUITE" = email ]; then
            CGO_ENABLED=0 go test -c -o build/email-browser-fixture ./internal/music
            MUSIC_SERVER_TEST_EMAIL_BINARY="$PWD/build/email-browser-fixture" node tests/registration-email-ui.cjs
          elif [ "$SUITE" = tags ]; then
            node ../contracts/verify.mjs
            MUSIC_SERVER_CONTRACT_LIVE=1 go test ./internal/music -run '^TestProtocolContract' -count=1
            python tests/test-admin-terminal.py
            python tests/test-schema-upgrade-history.py
            python tests/test-schema-preview.py
            SCHEMA=$(sed -nE 's/^[[:space:]]*Schema[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' internal/version/version.go)
            if [ "$SCHEMA" = 9 ]; then
              python tests/build-schema-preview.py
              python tests/schema-upgrade-process.py --old-server build/schema-preview/released/musicserver --bridge-server build/schema-preview/musicserver --new-server build/musicserver --from-schema 8 --to-schema 9
            else
              test "$SCHEMA" = 8
              python tests/schema-upgrade-process.py --old-server build/schema-preview/released/musicserver --new-server build/musicserver --from-schema 8 --to-schema 8
            fi
            MUSIC_SERVER_TEST_TAG_BACKUP_ONLY=1 node tests/management-ui.cjs
            node tests/tag-editor-ui.cjs
            node tests/tagger-ui.cjs
            node tests/track-filter-ui.cjs
            node tests/tag-ui.cjs
            node tests/tag-dictionary-ui.cjs
            MUSIC_SERVER_TAG_UI=1 MUSIC_SERVER_FILTER_UI=1 MUSIC_SERVER_TAG_WORKSPACE_UI=1 go test ./internal/music -run '^TestTagEditorLiveBrowser$|^TestTrackFilterLiveBrowser$|^TestTagWorkspaceLiveBrowser$' -count=1 -timeout 180s
          else
            node tests/dialog-dismiss-ui.cjs
            node tests/selection-ui.cjs
            node tests/lyrics-parser-test.cjs
            node tests/online-player-contract.cjs
            node tests/listening-ui.cjs
            node --test tests/listening-reporter-test.cjs
            MUSIC_SERVER_TEST_ONLINE_PLAYER_ONLY=1 node tests/management-ui.cjs
            MUSIC_SERVER_BROWSER_ENGINE=firefox MUSIC_SERVER_TEST_ONLINE_PLAYER_ONLY=1 node tests/management-ui.cjs
            MUSIC_SERVER_TEST_SELECTION_ONLY=1 node tests/management-ui.cjs
            node tests/upload-flow-contract.cjs
            node tests/upload-batch-contract.cjs
            node tests/audit-frontend-contract.cjs
            MUSIC_SERVER_TEST_AUDIT_FRONTEND_ONLY=1 node tests/management-ui.cjs
            node tests/upload-hash-ui.cjs
            MUSIC_SERVER_TEST_UPLOAD_FLOW_ONLY=1 node tests/management-ui.cjs
            node tests/management-ui.cjs
          fi
        env:
          SUITE: ${{ matrix.suite }}
          MUSIC_SERVER_TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-${{ matrix.suite }}-screenshots
          # Only screenshots made by isolated fixtures; never archive test DBs,
          # one-time tokens, runtime configs, audio or backup bundles.
          path: |
            server/build/browser-diagnostics/**/*.png
            server/build/personal-center-*/*.png
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [test, web]
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/tests/package-lock.json
      - name: Prepare real browser
        run: |
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          (cd tests && npx playwright install --with-deps chromium)
      - name: Build source-identified image
        run: |
          VERSION=$(go run ./cmd/release -version)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then echo 'Tag differs from code version'; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          docker compose config --quiet
          docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg VCS_MODIFIED=false --build-arg IMAGE_VERSION="$VERSION" -t pikmelo-server:ci .
      - name: Real schema upgrade and rollback acceptance
        run: |
          GOOS=linux CGO_ENABLED=0 python tests/build-schema-preview.py --version 0.21.18
          python tests/docker-smoke.py --image pikmelo-server:ci --schema8-binary build/schema-preview/musicserver --commit "$GITHUB_SHA" --browser-test
      - name: Validate formal release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: go test ./cmd/release -run '^TestCurrentReleaseNotesMatchProductIdentity$' -count=1
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable tested image
        id: image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.request
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tags/' + os.environ['GITHUB_REF_NAME']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=20):
                  raise SystemExit('Release already exists; preserve its image identity and use a new version.')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY
          docker tag pikmelo-server:ci "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:$VERSION"
          DIGEST=$(docker image inspect "$IMAGE_NAME:$VERSION" --format '{{index .RepoDigests 0}}')
          test "${DIGEST%@*}" = "$IMAGE_NAME"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "digest=${DIGEST#*@}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Attest tested image provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish Docker release identity
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          source = pathlib.Path('internal/version/version.go').read_text()
          schema = int(re.search(r'(?m)^\s*Schema\s*=\s*(\d+)', source)[1])
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['GITHUB_SHA'])
          assert re.fullmatch(r'ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+@sha256:[a-f0-9]{64}', os.environ['IMAGE_DIGEST'])
          metadata = dict(format=1, kind='docker', version=os.environ['VERSION'], schema=schema,
              commit=os.environ['GITHUB_SHA'], image=os.environ['IMAGE_DIGEST'], platform='linux/amd64')
          pathlib.Path('build/container-release.json').write_text(json.dumps(metadata, indent=2)+'\n')
          PY
          gh release create "$GITHUB_REF_NAME" build/container-release.json --verify-tag --draft --title "Pikmelo Server $GITHUB_REF_NAME (Docker)" --notes-file deploy/release-notes.md
          docker tag pikmelo-server:ci "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
