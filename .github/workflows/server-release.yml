name: Server tests and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['server/**', '.github/workflows/server-release.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - name: Install ffprobe (Ubuntu)
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffprobe; then
            # Hosted Azure mirrors have intermittently stalled during release builds.
            for source_path in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors*.txt; do
              if [ -f "$source_path" ]; then
                sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source_path"
              fi
            done
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
      - name: Install ffprobe (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        run: if (!(Get-Command ffprobe -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: Tests and vet
        run: |
          go test ./... -count=1 -timeout 180s
          go vet ./...
        env:
          CGO_ENABLED: '0'
      - name: Linux race tests
        if: runner.os == 'Linux'
        run: go test -race ./internal/update -count=1 -timeout 120s
      - name: Linux installation integration
        if: runner.os == 'Linux'
        run: sudo -E env PATH="$PATH" bash tests/update-systemd.sh

  package:
    timeout-minutes: 15
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - name: Build fixed-name binaries
        run: |
          mkdir -p build
          GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=true -o build/musicserver.exe ./cmd/musicserver
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -o build/musicserver ./cmd/musicserver
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -o build/musicserver-updater ./cmd/musicserver-updater
        env:
          CGO_ENABLED: '0'
      - name: Package and sign
        run: |
          VERSION=$(go run -buildvcs=true ./cmd/release -version)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then echo 'Tag differs from code version'; exit 1; fi
          go run -buildvcs=true ./cmd/release -sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - name: Verify signed packages and installer extraction
        run: |
          go run ./cmd/verify-release -dir build/packages
          MUSIC_SERVER_RELEASE_ARCHIVE="$PWD/build/packages/musicserver-linux-amd64.tar.gz" go test ./internal/update -run '^TestPublishedLinuxArchive$' -count=1
      - uses: actions/upload-artifact@v4
        with:
          name: musicserver-packages
          path: server/build/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" build/packages/* --verify-tag --draft --title "MusicServer $GITHUB_REF_NAME" --notes-file deploy/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
