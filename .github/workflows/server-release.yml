name: Server tests and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['server/**', '.github/workflows/server-release.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable schema-7 bridge for installation acceptance
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          ref: bb55d3c2f3688b4f9fb27fe5b22434cdcebf6967 # v0.20.3 bridge
          path: schema7-bridge
          persist-credentials: false
          sparse-checkout: server
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - name: Install ffprobe (Ubuntu)
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffprobe; then
            # Hosted Azure mirrors have intermittently stalled during release builds.
            for source_path in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors*.txt; do
              if [ -f "$source_path" ]; then
                sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source_path"
              fi
            done
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
      - name: Install ffprobe (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        run: if (!(Get-Command ffprobe -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: Tests and vet
        run: |
          go test ./... -count=1 -timeout "$GO_TEST_TIMEOUT"
          if [ "$?" -ne 0 ]; then exit 1; fi
          go vet ./...
        shell: bash
        env:
          CGO_ENABLED: '0'
          # Full account/tag coverage performs real Argon2 work. Hosted Windows
          # runners exceed five minutes while individual cases still progress.
          GO_TEST_TIMEOUT: ${{ runner.os == 'Windows' && '600s' || '180s' }}
      - name: Linux race tests
        if: runner.os == 'Linux'
        run: |
          go test -race ./internal/update -count=1 -timeout 120s
          go test -race ./internal/music -run '^TestRealtime|^TestAccountDeletion|^TestKeyDeletion|^TestStorage|^TestManagedBackup|^TestBackup|^TestResumable|^TestBrowse|^TestObjectSync|^TestMail|^TestEmail|^TestRegistration|^TestAccountStorage|^TestUploadEmailPolicy|^TestSchemaMigration|^TestTag|^TestTrackTag|^TestTrackFilter|^TestSavedTrackFilter' -count=1 -timeout 240s
      - name: Linux installation integration
        if: runner.os == 'Linux'
        run: |
          python tests/test-schema-preview.py
          (cd "$GITHUB_WORKSPACE/schema7-bridge/server" && CGO_ENABLED=0 go build -trimpath -buildvcs=true -o "$GITHUB_WORKSPACE/server/build/schema-preview/baseline/musicserver" ./cmd/musicserver)
          CGO_ENABLED=0 python tests/build-schema-preview.py
          export MUSIC_SERVER_SCHEMA7_BINARY="$PWD/build/schema-preview/baseline/musicserver"
          export MUSIC_SERVER_SCHEMA8_BINARY="$PWD/build/schema-preview/musicserver"
          export MUSIC_SERVER_SCHEMA7_VERSION=0.20.3
          export MUSIC_SERVER_SCHEMA8_VERSION="$(go run ./cmd/release -version)"
          sudo -E env PATH="$PATH" bash tests/update-systemd.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [management, personal-center, realtime, browse, email, tags]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Checkout released schema-7 source for upgrade acceptance
        if: matrix.suite == 'tags'
        uses: actions/checkout@v4
        with:
          ref: fc6cd7745fa11818de59e6566ed9d664bc71f618 # v0.20.2
          path: schema7-release
          persist-credentials: false
          sparse-checkout: server
      - name: Checkout immutable schema-7 bridge for upgrade acceptance
        if: matrix.suite == 'tags'
        uses: actions/checkout@v4
        with:
          ref: bb55d3c2f3688b4f9fb27fe5b22434cdcebf6967 # v0.20.3 bridge
          path: schema7-bridge
          persist-credentials: false
          sparse-checkout: server
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/tests/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Ubuntu mirrors before browser dependencies
        run: |
          for source_path in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source_path" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source_path"
            fi
          done
          sudo tee /etc/apt/apt.conf.d/99-musicserver-ci >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
      - name: Install isolated browser dependencies
        run: |
          python -m pip install pexpect==4.9.0
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          cd tests
          npx playwright install --with-deps chromium
      - name: Install ffprobe
        timeout-minutes: 8
        run: |
          if ! command -v ffprobe; then
            for source_path in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors*.txt; do
              if [ -f "$source_path" ]; then sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source_path"; fi
            done
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
      - name: Build isolated server
        run: go build -trimpath -buildvcs=true -o build/musicserver ./cmd/musicserver
        env:
          CGO_ENABLED: '0'
      - name: Build the released schema-7 baseline
        if: matrix.suite == 'tags'
        working-directory: schema7-release/server
        run: go build -trimpath -buildvcs=true -o "$GITHUB_WORKSPACE/server/build/schema-preview/released/musicserver" ./cmd/musicserver
        env:
          CGO_ENABLED: '0'
      - name: Build the released schema-7 bridge
        if: matrix.suite == 'tags'
        working-directory: schema7-bridge/server
        run: go build -trimpath -buildvcs=true -o "$GITHUB_WORKSPACE/server/build/schema-preview/bridge/musicserver" ./cmd/musicserver
        env:
          CGO_ENABLED: '0'
      - name: Real browser acceptance
        run: |
          node --test tests/browser-wait-test.cjs tests/resumable-ui.cjs tests/browse-state-test.cjs
          mkdir -p build/browser-diagnostics
          export TMPDIR="$PWD/build/browser-diagnostics"
          export MUSIC_SERVER_TEST_BINARY="$PWD/build/musicserver"
          if [ "$SUITE" = personal-center ]; then
            node tests/personal-dialogs-ui.cjs
            node tests/avatar-ui.cjs
            node tests/personal-center-ui.cjs
            MUSIC_SERVER_AVATAR_UI=1 go test ./internal/music -run '^TestAvatarLiveBrowser$' -count=1 -timeout 120s
          elif [ "$SUITE" = realtime ]; then
            MUSIC_SERVER_TEST_REALTIME_ONLY=1 node tests/management-ui.cjs
          elif [ "$SUITE" = browse ]; then
            node tests/browse-ui.cjs
          elif [ "$SUITE" = email ]; then
            CGO_ENABLED=0 go test -c -o build/email-browser-fixture ./internal/music
            MUSIC_SERVER_TEST_EMAIL_BINARY="$PWD/build/email-browser-fixture" node tests/registration-email-ui.cjs
          elif [ "$SUITE" = tags ]; then
            python tests/test-schema-preview.py
            python tests/test-admin-terminal.py
            python tests/schema-upgrade-process.py --old-server build/schema-preview/released/musicserver --new-server build/musicserver
            python tests/schema-upgrade-process.py --old-server build/schema-preview/bridge/musicserver --new-server build/musicserver
            MUSIC_SERVER_TEST_TAG_BACKUP_ONLY=1 node tests/management-ui.cjs
            node tests/tag-editor-ui.cjs
            node tests/tagger-ui.cjs
            node tests/track-filter-ui.cjs
            node tests/tag-ui.cjs
            node tests/tag-dictionary-ui.cjs
            MUSIC_SERVER_TAG_UI=1 MUSIC_SERVER_FILTER_UI=1 MUSIC_SERVER_TAG_WORKSPACE_UI=1 go test ./internal/music -run '^TestTagEditorLiveBrowser$|^TestTrackFilterLiveBrowser$|^TestTagWorkspaceLiveBrowser$' -count=1 -timeout 180s
          else
            node tests/dialog-dismiss-ui.cjs
            node tests/management-ui.cjs
          fi
        env:
          SUITE: ${{ matrix.suite }}
          MUSIC_SERVER_TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-${{ matrix.suite }}-screenshots
          # Only screenshots made by isolated fixtures; never archive test DBs,
          # one-time tokens, runtime configs, audio or backup bundles.
          path: |
            server/build/browser-diagnostics/**/*.png
            server/build/personal-center-*/*.png
          if-no-files-found: ignore
          retention-days: 7

  player-compatibility:
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        player: [33da837016e01419db3200bb0adcc58aae179c56, f36c07dbe7f3890080b0290dd4ad32bb7729711d]
        schema: [7, 8]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: server-source
      - name: Checkout released schema-7 source for upgrade acceptance
        uses: actions/checkout@v4
        with:
          ref: bb55d3c2f3688b4f9fb27fe5b22434cdcebf6967 # v0.20.3 bridge
          path: schema7-bridge
          persist-credentials: false
          sparse-checkout: server
      - name: Checkout accepted native player
        uses: actions/checkout@v4
        with:
          repository: ShenYunyao1/MusicPlayer-for-Windows
          ref: ${{ matrix.player }}
          path: player
          persist-credentials: false
      - name: Checkout administrator provisioning fixture
        uses: actions/checkout@v4
        with:
          repository: ShenYunyao1/MusicPlayer-for-Windows
          ref: 917f43c4b2ca95c34f5e65816c25fcd6d1ab6b2c
          path: player-fixture
          sparse-checkout: UnitTest/remote_server_integration.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use current account provisioning with the pinned native code
        run: |
          Copy-Item -LiteralPath 'player-fixture/UnitTest/remote_server_integration.py' -Destination 'player/UnitTest/remote_server_integration.py'
          "fixture=917f43c4b2ca95c34f5e65816c25fcd6d1ab6b2c" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server-source/server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native integration dependencies
        timeout-minutes: 5
        run: |
          python -m pip install pywinpty==2.0.15
          if ($LASTEXITCODE -ne 0) { throw 'pywinpty installation failed' }
          if (!(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'ffmpeg installation failed' }
          }
      - name: Build this candidate server
        id: candidate
        working-directory: server-source/server
        run: |
          go build -trimpath -buildvcs=true -o build/musicserver.exe ./cmd/musicserver
          if ($LASTEXITCODE -ne 0) { throw 'Candidate server build failed' }
          $candidateVersion = go run ./cmd/release -version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read candidate identity' }
          $candidateBinary = '../server-source/server/build/musicserver.exe'
          Push-Location '../../schema7-bridge/server'
          try {
            go build -trimpath -buildvcs=true -o "$env:GITHUB_WORKSPACE/server-source/server/build/schema-preview/bridge/musicserver.exe" ./cmd/musicserver
            if ($LASTEXITCODE -ne 0) { throw 'Cannot build released schema-7 bridge' }
          } finally { Pop-Location }
          if ('${{ matrix.schema }}' -eq '8') {
            python tests/schema-upgrade-process.py --old-server build/schema-preview/bridge/musicserver.exe --new-server build/musicserver.exe
            if ($LASTEXITCODE -ne 0) { throw 'Real populated schema migration failed' }
          } else {
            $candidateBinary = '../server-source/server/build/schema-preview/bridge/musicserver.exe'
            $candidateVersion = '0.20.3'
          }
          "version=$candidateVersion" >> $env:GITHUB_OUTPUT
          "binary=$candidateBinary" >> $env:GITHUB_OUTPUT
          "server=$(git rev-parse HEAD)" >> $env:GITHUB_STEP_SUMMARY
          "player=${{ matrix.player }}" >> $env:GITHUB_STEP_SUMMARY
          "schema=${{ matrix.schema }} (7: fixed released bridge; 8: current candidate without overlay)" >> $env:GITHUB_STEP_SUMMARY
        env:
          CGO_ENABLED: '0'
      - name: Real WinHTTP TLS, cache and two-ended integration
        working-directory: player
        run: |
          ./UnitTest/run-remote-library-cache-tests.ps1 -Python python `
            -ServerBinary '${{ steps.candidate.outputs.binary }}' `
            -ServerSource '../server-source/server' `
            -ExpectedServerVersion '${{ steps.candidate.outputs.version }}' `
            -ExpectedServerSchema ${{ matrix.schema }}

  package:
    timeout-minutes: 15
    needs: [test, web, player-compatibility]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - name: Build fixed-name binaries
        run: |
          mkdir -p build
          GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=true -o build/musicserver.exe ./cmd/musicserver
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -o build/musicserver ./cmd/musicserver
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -o build/musicserver-updater ./cmd/musicserver-updater
        env:
          CGO_ENABLED: '0'
      - name: Package and sign
        run: |
          VERSION=$(go run -buildvcs=true ./cmd/release -version)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then echo 'Tag differs from code version'; exit 1; fi
          go run -buildvcs=true ./cmd/release -sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - name: Verify signed packages and installer extraction
        run: |
          go run ./cmd/verify-release -dir build/packages
          MUSIC_SERVER_RELEASE_ARCHIVE="$PWD/build/packages/musicserver-linux-amd64.tar.gz" go test ./internal/update -run '^TestPublishedLinuxArchive$' -count=1
      - uses: actions/upload-artifact@v4
        with:
          name: musicserver-packages
          path: server/build/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" build/packages/* --verify-tag --draft --title "MusicServer $GITHUB_REF_NAME" --notes-file deploy/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
